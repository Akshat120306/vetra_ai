<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopt a Pet - VetraChain</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-50">

<!-- Navbar -->
<div class="bg-teal-500 text-white p-4 flex justify-between">
  <h1 class="text-xl font-bold">🐾 Adopt a Pet</h1>
  <button onclick="goBack()" class="bg-white text-teal-500 px-3 py-1 rounded">
    Back
  </button>
</div>

<!-- Container -->
<div class="p-6">
  <h2 class="text-2xl font-bold mb-4">Available for Adoption</h2>

  <div id="petList" class="grid md:grid-cols-3 gap-6"></div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDyt...",
  authDomain: "vetrachain-7721f.firebaseapp.com",
  projectId: "vetrachain-7721f"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

async function loadAdoptionPets() {

  const container = document.getElementById("petList");
  container.innerHTML = "Loading...";

  const snapshot = await db.collection("rescued_pets")
    .where("adoptionReady", "==", true)
    .get();

  if (snapshot.empty) {
    container.innerHTML = "No pets available for adoption";
    return;
  }

  container.innerHTML = "";

  snapshot.forEach(doc => {
    const pet = doc.data();

    const location = pet.adoptionLocation || "Not specified";
    const fee = pet.adoptionFee || "0";
    const contact = pet.adoptionContact || null;

    container.innerHTML += `
        <div class="bg-white rounded-xl shadow p-4 hover:shadow-lg transition">

        <div class="text-5xl text-center mb-3">🐶</div>

        <h3 class="text-lg font-bold">${pet.name}</h3>
        <p class="text-sm text-gray-600">${pet.type} • ${pet.breed || "Unknown"}</p>

        <div class="mt-3 text-sm">
            <p><b>📍 Location:</b> ${location}</p>
            <p><b>💰 Fee:</b> ₹${fee}</p>
        </div>

        <button onclick="showContact('${contact}')"
            class="mt-4 w-full bg-green-500 text-white py-2 rounded">
            📞 Contact NGO
        </button>

        </div>
    `;
});
}

function showContact(number) {
  if (!number) {
    alert("Contact not available");
    return;
  }

  alert("📞 Contact: " + number);
}

function goBack() {
  window.location.href = "hooman.html";
}

loadAdoptionPets();

</script>

</body>
</html>
