<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NGO Dashboard - VetraChain</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .ngo-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }

    .ngo-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(2,119,189,0.1);
      transition: 0.3s;
    }

    .ngo-card:hover {
      transform: translateY(-10px);
    }

    .ngo-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .ngo-title {
      font-size: 20px;
      font-weight: 700;
      color: #0277BD;
    }

    .ngo-desc {
      font-size: 14px;
      color: #666;
      margin: 10px 0 20px;
    }

    .ngo-button {
      background: linear-gradient(135deg,#0277BD,#00BCD4);
      color: white;
      padding: 12px 25px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }

    .role-switch-banner {
      margin: 20px;
    }

    .role-switch-banner button {
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #0277BD;
      background: white;
      color: #0277BD;
      cursor: pointer;
    }
  </style>
</head>

<body class="bg-gray-50">

<!-- Navbar -->
<div class="bg-teal-500 text-white p-4 flex justify-between">
  <h1 class="text-xl font-bold">🐾 VetraChain NGO</h1>
  <button onclick="logout()" class="bg-white text-teal-500 px-3 py-1 rounded">
    Logout
  </button>
</div>

<!-- Switch -->
<div class="role-switch-banner">
  <button onclick="switchRole()">↩️ Switch to HOOMAN</button>
</div>

<!-- Dashboard -->
<div id="dashboardContainer" class="ngo-cards"></div>

<script>

function renderNGO() {
  document.getElementById("dashboardContainer").innerHTML = `
    
    <div class="ngo-card">
        <div class="ngo-icon">📋</div>
        <div class="ngo-title">Register Rescued Pet</div>
        <div class="ngo-desc">Create profile for rescued animals</div>
        <button class="ngo-button" onclick="openNGOForm()">Start Registration</button>
    </div>

    <div class="ngo-card">
        <div class="ngo-icon">🏥</div>
        <div class="ngo-title">Track Treatment</div>
        <div class="ngo-desc">Monitor recovery & vaccination</div>
        <button class="ngo-button" onclick="openTracker()">View Tracker</button>
    </div>

    <div class="ngo-card">
        <div class="ngo-icon">🎖️</div>
        <div class="ngo-title">Badge Management</div>
        <div class="ngo-desc">Mark adoption ready animals</div>
        <button class="ngo-button" onclick="openAdoption()">Manage</button>
    </div>
  `;
}

function switchRole() {
  window.location.href = "hooman.html";
}
function openNGOForm() {
  window.location.href = "register-pet.html";
}
function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}
function openTracker() {
  window.location.href = "track-treatment.html";
}
function openAdoption() {
  window.location.href = "adoption-ready.html";
}

renderNGO();

</script>

</body>
</html>
